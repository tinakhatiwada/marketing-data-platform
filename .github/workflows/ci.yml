name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit + end-to-end tests
        run: pytest -q

      - name: Demo pipeline (extract → load → dbt build → quality checks)
        run: adpulse run --mode demo --days 60

      - name: Build dbt docs site
        working-directory: dbt
        run: |
          dbt docs generate --profiles-dir . --target local --static
          mkdir -p ../site && cp target/static_index.html ../site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # Publishes the dbt docs (lineage graph + every column definition) to GitHub Pages.
  # One-time setup: repo Settings → Pages → Source: "GitHub Actions".
  docs:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
