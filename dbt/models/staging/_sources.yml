version: 2

sources:
  - name: raw
    description: Raw API extracts, loaded by the Python pipeline (one partition per report_date).
    schema: "{{ env_var('RAW_DATASET', 'raw') }}"
    config:
      loaded_at_field: _extracted_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: google_ads_campaign_daily
        description: Google Ads API — GAQL `FROM campaign`, one row per campaign per day.
        columns:
          - name: report_date
            data_tests: [not_null]
          - name: campaign_id
            data_tests: [not_null]
          - name: cost_micros
            data_tests: [non_negative]

      - name: meta_ads_campaign_daily
        description: Meta Marketing API `/insights` at level=campaign, time_increment=1.
        columns:
          - name: report_date
            data_tests: [not_null]
          - name: campaign_id
            data_tests: [not_null]
          - name: spend
            data_tests: [non_negative]

      - name: ga4_traffic_daily
        description: GA4 Data API `runReport` by date × source × medium × campaign.
        columns:
          - name: report_date
            data_tests: [not_null]
          - name: property_id
            data_tests: [not_null]
