# Run with:  dbt build --profiles-dir . --target local      (DuckDB, no cloud needed)
#            dbt build --profiles-dir . --target bigquery   (needs GCP_PROJECT + auth)
adpulse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../warehouse/adpulse.duckdb') }}"
      schema: analytics
      threads: 4

    bigquery:
      type: bigquery
      # `oauth` uses Application Default Credentials: your gcloud login locally,
      # the Cloud Run job's service account in production. No key files.
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'set-GCP_PROJECT') }}"
      dataset: analytics
      location: "{{ env_var('BQ_LOCATION', 'australia-southeast1') }}"
      threads: 8
      priority: interactive
      job_execution_timeout_seconds: 900
      job_retries: 2
      # Cost guardrail: any single dbt query scanning > 10 GB fails instead of billing.
      maximum_bytes_billed: 10000000000
